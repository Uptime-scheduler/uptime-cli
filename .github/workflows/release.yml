name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.release.tag_name || inputs.tag }}" \
            --repo Uptime-scheduler/uptime-cli \
            --pattern "*.sha256" \
            --dir artifacts/

      - name: Compute Homebrew SHAs
        id: shas
        run: |
          ARM_SHA=$(grep -h "macos-arm64" artifacts/*.sha256 | awk '{print $1}')
          X86_SHA=$(grep -h "macos-x86_64" artifacts/*.sha256 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"
          echo "ARM SHA: $ARM_SHA"
          echo "X86 SHA: $X86_SHA"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Uptime-scheduler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          ARM_SHA: ${{ steps.shas.outputs.arm_sha }}
          X86_SHA: ${{ steps.shas.outputs.x86_sha }}
          REPO: Uptime-scheduler/uptime-cli
        run: |
          VERSION="${VERSION#v}"
          cat > homebrew-tap/Formula/uptime.rb << FORMULA
          # frozen_string_literal: true

          class Uptime < Formula
            desc "CLI for managing Uptime Scheduler — start, stop, and schedule AWS resources"
            homepage "https://uptimescheduler.com"
            version "${VERSION}"
            license "BUSL-1.1"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/uptime-macos-arm64.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/uptime-macos-x86_64.tar.gz"
                sha256 "${X86_SHA}"
              end
            end

            def install
              bin.install "uptime"
            end

            test do
              assert_match "uptime", shell_output("#{bin}/uptime --version")
            end
          end
          FORMULA

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/uptime.rb
          git diff --cached --quiet && echo "Formula unchanged, skipping" && exit 0
          git commit -m "uptime ${{ github.event.release.tag_name || inputs.tag }}"
          git push
