name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true

jobs:
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download SHA256 files from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo Uptime-scheduler/uptime-cli \
            --pattern "*.sha256" \
            --dir artifacts/

      - name: Compute Homebrew SHAs
        id: shas
        run: |
          ARM_SHA=$(grep -h "macos-arm64" artifacts/*.sha256 | awk '{print $1}')
          X86_SHA=$(grep -h "macos-x86_64" artifacts/*.sha256 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Uptime-scheduler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARM_SHA: ${{ steps.shas.outputs.arm_sha }}
          X86_SHA: ${{ steps.shas.outputs.x86_sha }}
        run: |
          sed \
            -e "s|{{VERSION}}|$VERSION|g" \
            -e "s|{{ARM_SHA}}|$ARM_SHA|g" \
            -e "s|{{X86_SHA}}|$X86_SHA|g" \
            homebrew-tap/Formula/uptime.rb.tpl > homebrew-tap/Formula/uptime.rb
          cat homebrew-tap/Formula/uptime.rb

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/uptime.rb
          git diff --cached --quiet && echo "Formula unchanged" && exit 0
          git commit -m "uptime ${{ steps.meta.outputs.tag }}"
          git push
