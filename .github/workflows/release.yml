name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: uptime

jobs:
  # ── 1. Build matrix ──────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # macOS — Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz

          # Linux — x86_64 static (musl)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            use_cross: true

          # Linux — ARM64 static (musl)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            use_cross: true

          # Windows — x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross handles musl toolchain inside Docker — no manual gcc setup needed
      - name: Install cross (Linux musl targets)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary (cross — Linux musl)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo — macOS / Windows)
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          ASSET="${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.target }}.tar.gz"
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} .
          tar -czf "$ASSET" ${{ env.BINARY_NAME }} README.md LICENSE
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          sha256sum "$ASSET" > "${ASSET}.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.release.tag_name }}".TrimStart("v")
          $ASSET = "${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.target }}.zip"
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" .
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe","README.md","LICENSE" -DestinationPath $ASSET
          echo "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append
          $hash = (Get-FileHash $ASSET -Algorithm SHA256).Hash.ToLower()
          "$hash  $ASSET" | Out-File "${ASSET}.sha256"

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Upload artifacts for homebrew job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 1

  # ── 2. Update Homebrew tap ───────────────────────────────────────────────────
  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Compute Homebrew SHAs
        id: shas
        run: |
          ARM_SHA=$(grep -h "aarch64-apple-darwin.tar.gz" artifacts/*.sha256 | awk '{print $1}')
          X86_SHA=$(grep -h "x86_64-apple-darwin.tar.gz" artifacts/*.sha256 | awk '{print $1}')
          echo "arm_sha=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_sha=$X86_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Uptime-scheduler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        env:
          VERSION: ${{ github.event.release.tag_name }}
          ARM_SHA: ${{ steps.shas.outputs.arm_sha }}
          X86_SHA: ${{ steps.shas.outputs.x86_sha }}
          REPO: Uptime-scheduler/uptime-cli
        run: |
          # Strip leading 'v' from tag for version field
          VERSION="${VERSION#v}"
          cat > homebrew-tap/Formula/uptime.rb << FORMULA
          # frozen_string_literal: true

          class Uptime < Formula
            desc "CLI for managing Uptime Scheduler — start, stop, and schedule AWS resources"
            homepage "https://uptimescheduler.com"
            version "${VERSION}"
            license "BUSL-1.1"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/uptime-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/uptime-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_SHA}"
              end
            end

            def install
              bin.install "uptime"
            end

            test do
              assert_match "uptime", shell_output("#{bin}/uptime --version")
            end
          end
          FORMULA

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/uptime.rb
          git diff --cached --quiet && echo "Formula unchanged" && exit 0
          git commit -m "uptime ${{ github.event.release.tag_name }}"
          git push